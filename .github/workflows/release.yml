# On a vX.Y.Z tag: build makeit for the six targets with this release's version, repository and
# public key (minisign.pub at the tag), write checksums.txt, fill in the install scripts, and
# attach all of it to a draft pre-release. Signing stays with the owner: they sign checksums.txt
# with their key (the trusted comment "makeit X.Y.Z checksums.txt"), upload checksums.txt.minisig
# and publish the draft. No secret key reaches this workflow.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and draft the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: build, checksums and install scripts
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GOTOOLCHAIN: local
        run: |
          set -eu
          v=${TAG#v}
          [ -f minisign.pub ] || { echo "minisign.pub is missing: the owner's public key goes there"; exit 1; }
          key=$(sed -n 2p minisign.pub)
          out=$PWD/dist
          mkdir -p "$out"
          (cd cli && go generate ./...)
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*} arch=${t#*/}
            a=$arch; [ "$a" = amd64 ] && a=x64
            ext=; [ "$os" = windows ] && ext=.exe
            (cd cli && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "$out/makeit-$v-$os-$a$ext" \
              -ldflags "-s -w -X makeit/internal/buildinfo.Version=$v -X makeit/internal/buildinfo.Commit=$GITHUB_SHA -X makeit/internal/buildinfo.Repo=$REPO -X makeit/internal/buildinfo.KeyCurrent=$key" ./cmd/makeit)
          done
          (cd "$out" && sha256sum makeit-* > checksums.txt)
          for s in install.sh install.ps1; do
            sed -e "s|@VERSION@|$v|" -e "s|@REPO@|$REPO|" -e "s|@PUBKEY@|$key|" "$s" > "$out/$s"
          done
      - name: draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --prerelease --verify-tag --title "$TAG" --notes "makeit $TAG (beta)" dist/*
